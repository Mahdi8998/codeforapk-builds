name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          echo "=== Files in repo root ==="
          ls -la
          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No ZIP file found!"
            exit 1
          fi
          echo "Found ZIP: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.2"

      - name: Build Debug APK
        run: |
          set -o pipefail
          GRADLEW_PATH=$(find extracted -name "gradlew" -type f | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            PROJ_DIR=$(dirname "$GRADLEW_PATH")
          else
            SETTINGS_PATH=$(find extracted -name "settings.gradle*" | head -n 1)
            if [ -z "$SETTINGS_PATH" ]; then
              SETTINGS_PATH=$(find extracted -name "build.gradle*" | head -n 1)
            fi
            if [ -z "$SETTINGS_PATH" ]; then
              echo "::error::No Gradle files found inside ZIP!"
              exit 1
            fi
            PROJ_DIR=$(dirname "$SETTINGS_PATH")
          fi
          echo "Project directory: $PROJ_DIR"
          cd "$PROJ_DIR"
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          else
            gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          fi

      - name: Show failure reason
        if: failure()
        run: |
          LOG=$(find extracted -name "build.log" | head -n 1)
          if [ -n "$LOG" ]; then
            echo "===== FAILURE DETAILS ====="
            grep -B 2 -A 50 "What went wrong" "$LOG" || tail -100 "$LOG"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
